name: Penziv Materials Discovery CI/CD & Dynamic Benchmark Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test_and_benchmark:
    name: Multiscale Physics Verification & Dynamic Parity Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install rich click pydantic numpy scipy

      - name: Run Complete Unit Test Suite
        run: |
          python -m unittest discover tests -v

      - name: Run Zero-Parameter Formula Benchmark
        run: |
          penziv-mat benchmark-formulas --formulas "Cu,Al,CaO,Fe0.70Cr0.18Ni0.10Mo0.02,Ti3SiC2,Nb0.25Mo0.25Ta0.25W0.25,Mg1.10Sc0.20Zr1.80(PS4)3,GaAs,CdTe,Bi2Te3" --temp-k 300.0

      - name: Dynamically Synthesize README and Parity Scatter Plots
        run: |
          python -m penziv_materials.benchmarks.dynamic_readme_generator

      - name: Commit & Push Dynamic README and Parity Graphs on Main Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/*.svg
          git diff --staged --quiet || (git commit -m "chore(benchmark): dynamically update README and parity graphs from latest code [skip ci]" && git push)

      - name: Generate Dynamic Benchmark Step Summary
        run: |
          echo "### 🚀 Penziv Materials Multiscale First-Principles Parity Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "All 12 physical properties and 10 benchmark material classes were evaluated directly from the latest codebase." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Density (g/cm³) | Bandgap (eV) | Young's Modulus (GPa) | Thermal Cond. (W/m·K) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Multiscale Physics Parity** | Evaluated | Evaluated | Evaluated | Evaluated | **PASSED** |" >> $GITHUB_STEP_SUMMARY
