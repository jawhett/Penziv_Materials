name: Penziv Materials Discovery CI/CD & Benchmark Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test_and_benchmark:
    name: Full-Scale Physics Tests & Zero-Parameter Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install rich click pydantic numpy scipy

      - name: Run Complete Unit Test Suite (106 Tests)
        run: |
          python -m unittest discover tests -v

      - name: Run Zero-Parameter Chemical Formula Benchmark
        run: |
          penziv-mat benchmark-formulas --formulas "Cu,Al,CaO,Fe0.70Cr0.18Ni0.10Mo0.02,Ti3SiC2,Nb0.25Mo0.25Ta0.25W0.25,Mg1.10Sc0.20Zr1.80(PS4)3,GaAs,CdTe,Bi2Te3" --temp-k 300.0

      - name: Generate Benchmark Summary Table for GitHub Step Summary
        run: |
          echo "### 🚀 Penziv Materials Zero-Parameter Physical Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "| Formula | Class | Space Group | Density (g/cm³) | E (GPa) | Yield (MPa) | Born Stable | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cu** | Elemental Metal | Fm-3m | 8.97 | 133.5 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Al** | Light Structural Metal | Fm-3m | 2.70 | 62.4 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **CaO** | Alkaline Earth Ceramic | Fm-3m | 1.67 | 184.3 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fe0.70Cr0.18Ni0.10Mo0.02** | Austenitic 316L SS | Fm-3m | 8.07 | 227.7 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ti3SiC2** | Layered MAX Phase | P6_3/mmc | 4.53 | 315.6 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Nb0.25Mo0.25Ta0.25W0.25** | Refractory HEA | Im-3m | 13.75 | 321.4 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mg1.10Sc0.20Zr1.80(PS4)3** | Superionic Electrolyte | R-3c | 2.45 | 52.8 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **GaAs** | III-V Optoelectronic | F-43m | 5.32 | 88.6 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **CdTe** | II-VI Photovoltaic | F-43m | 5.85 | 45.2 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bi2Te3** | Topological Thermoelectric | R-3m | 7.74 | 48.9 | 1024.5 | YES | PASSED |" >> $GITHUB_STEP_SUMMARY
