[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penziv-materials"
version = "3.2.0"
description = "Autonomous Multiscale First-Principles Materials Property Prediction and Inverse Discovery Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "jawhett" }
]
keywords = [
    "materials-science",
    "multiscale-modeling",
    "first-principles",
    "density-functional-theory",
    "crystal-plasticity",
    "phase-field",
    "discrete-dislocation-dynamics",
    "uncertainty-quantification",
    "autonomous-discovery"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "spglib>=2.0.0",
    "pymatgen>=2023.1.0",
    "pycalphad>=0.10.0",
    "ase>=3.22.0",
    "gudhi>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
]
advanced = [
    "sympy>=1.12",
    "zstandard>=0.22.0",
    "h5py>=3.9.0",
]

[project.scripts]
penziv-mat = "penziv_materials.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/penziv_materials"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
